naftiko: 1.0.0-alpha2
info:
  label: Trigger.dev Management API — Tasks
  description: 'Trigger.dev Management API — Tasks. 2 operations. Lead operation: Batch Trigger Tasks. Self-contained Naftiko
    capability covering one Trigger Dev business surface.'
  tags:
  - Trigger Dev
  - Tasks
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRIGGER_DEV_API_KEY: TRIGGER_DEV_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-tasks
    baseUri: https://api.trigger.dev
    description: Trigger.dev Management API — Tasks business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-tasks-batch
      path: /api/v1/tasks/batch
      operations:
      - name: batchtriggertask
        method: POST
        description: Batch Trigger Tasks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-tasks-taskIdentifier-trigger
      path: /api/v1/tasks/{taskIdentifier}/trigger
      operations:
      - name: triggertask
        method: POST
        description: Trigger Task
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: taskIdentifier
          in: path
          type: string
          description: The task identifier (e.g., my-task)
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.TRIGGER_DEV_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-tasks-rest
    port: 8080
    description: REST adapter for Trigger.dev Management API — Tasks. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1/tasks/batch
      name: api-v1-tasks-batch
      description: REST surface for api-v1-tasks-batch.
      operations:
      - method: POST
        name: batchtriggertask
        description: Batch Trigger Tasks
        call: management-tasks.batchtriggertask
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/tasks/{taskidentifier}/trigger
      name: api-v1-tasks-taskidentifier-trigger
      description: REST surface for api-v1-tasks-taskIdentifier-trigger.
      operations:
      - method: POST
        name: triggertask
        description: Trigger Task
        call: management-tasks.triggertask
        with:
          taskIdentifier: rest.taskIdentifier
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-tasks-mcp
    port: 9090
    transport: http
    description: MCP adapter for Trigger.dev Management API — Tasks. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: batch-trigger-tasks
      description: Batch Trigger Tasks
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-tasks.batchtriggertask
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: trigger-task
      description: Trigger Task
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-tasks.triggertask
      with:
        taskIdentifier: tools.taskIdentifier
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
