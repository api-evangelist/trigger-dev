naftiko: "1.0.0-alpha1"

info:
  label: "Trigger.dev Management API"
  description: >-
    Trigger.dev Management API for programmatic control of background job workflows.
    Provides endpoints for triggering tasks, monitoring runs, managing schedules,
    queues, deployments, environment variables, batches, and waitpoints.
  tags:
    - Trigger.dev
    - Workflow Automation
    - Background Jobs
    - Task Management
    - Scheduling
    - Queue Management
    - Open Source
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRIGGER_SECRET_KEY: TRIGGER_SECRET_KEY

capability:
  consumes:
    - type: http
      namespace: trigger-dev
      baseUri: https://api.trigger.dev
      description: "Trigger.dev Management API for workflow orchestration"
      authentication:
        type: bearer
        token: "{{TRIGGER_SECRET_KEY}}"
      resources:
        - name: tasks
          path: /api/v1/tasks
          description: Task triggering operations
          operations:
            - name: trigger-task
              method: POST
              description: Trigger a single task run
              inputParameters:
                - name: taskIdentifier
                  in: path
                  type: string
                  required: true
                  description: Task identifier
              body:
                type: json
                data:
                  payload: "{{tools.payload}}"
                  options: "{{tools.options}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: batch-trigger-tasks
              method: POST
              description: Trigger multiple task runs in a batch
              body:
                type: json
                data:
                  items: "{{tools.items}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: runs
          path: /api/v1/runs
          description: Run monitoring and management
          operations:
            - name: list-runs
              method: GET
              description: List runs with filtering and pagination
              inputParameters:
                - name: filter[status]
                  in: query
                  type: array
                  required: false
                  description: Filter by run status
                - name: filter[taskIdentifier]
                  in: query
                  type: array
                  required: false
                  description: Filter by task identifiers
                - name: filter[tag]
                  in: query
                  type: array
                  required: false
                  description: Filter by tags
                - name: page[size]
                  in: query
                  type: integer
                  required: false
                  description: Page size
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-run
              method: GET
              description: Retrieve details for a specific run
              inputParameters:
                - name: runId
                  in: path
                  type: string
                  required: true
                  description: Run identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: cancel-run
              method: POST
              description: Cancel a queued or executing run
              inputParameters:
                - name: runId
                  in: path
                  type: string
                  required: true
                  description: Run identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: replay-run
              method: POST
              description: Replay a completed run with the same payload
              inputParameters:
                - name: runId
                  in: path
                  type: string
                  required: true
                  description: Run identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: schedules
          path: /api/v1/schedules
          description: Scheduled task management
          operations:
            - name: list-schedules
              method: GET
              description: List all configured schedules
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-schedule
              method: POST
              description: Create a new cron schedule
              body:
                type: json
                data:
                  task: "{{tools.task}}"
                  cron: "{{tools.cron}}"
                  deduplicationKey: "{{tools.deduplicationKey}}"
                  timezone: "{{tools.timezone}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-schedule
              method: DELETE
              description: Delete a schedule
              inputParameters:
                - name: scheduleId
                  in: path
                  type: string
                  required: true
                  description: Schedule identifier
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: queues
          path: /api/v1/queues
          description: Queue management and concurrency control
          operations:
            - name: list-queues
              method: GET
              description: List all task queues
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: pause-queue
              method: POST
              description: Pause a queue
              inputParameters:
                - name: queueName
                  in: path
                  type: string
                  required: true
                  description: Queue name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: resume-queue
              method: POST
              description: Resume a paused queue
              inputParameters:
                - name: queueName
                  in: path
                  type: string
                  required: true
                  description: Queue name
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: waitpoints
          path: /api/v1/waitpoints
          description: Waitpoint token management for human-in-the-loop workflows
          operations:
            - name: create-waitpoint-token
              method: POST
              description: Create a waitpoint token to pause a run
              body:
                type: json
                data:
                  idempotencyKey: "{{tools.idempotencyKey}}"
                  ttl: "{{tools.ttl}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: complete-waitpoint-token
              method: POST
              description: Complete a waitpoint to resume the paused run
              inputParameters:
                - name: tokenId
                  in: path
                  type: string
                  required: true
                  description: Waitpoint token identifier
              body:
                type: json
                data:
                  data: "{{tools.data}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: trigger-dev-management-rest
      resources:
        - path: /v1/tasks/{taskIdentifier}/trigger
          name: task-trigger
          description: Trigger task runs
          operations:
            - method: POST
              name: trigger-task
              description: Trigger a task run
              call: "trigger-dev.trigger-task"
              with:
                taskIdentifier: "rest.taskIdentifier"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/runs
          name: runs
          description: Run listing and management
          operations:
            - method: GET
              name: list-runs
              description: List runs
              call: "trigger-dev.list-runs"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: trigger-dev-management-mcp
      transport: http
      tools:
        - name: trigger-task
          description: Trigger a background task run
          hints:
            readOnly: false
            openWorld: false
          call: "trigger-dev.trigger-task"
          with:
            taskIdentifier: "tools.taskIdentifier"
            payload: "tools.payload"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-runs
          description: List task runs with filtering by status or tags
          hints:
            readOnly: true
            openWorld: false
          call: "trigger-dev.list-runs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-run
          description: Get details for a specific run
          hints:
            readOnly: true
            openWorld: false
          call: "trigger-dev.get-run"
          with:
            runId: "tools.runId"
          outputParameters:
            - type: object
              mapping: "$."
