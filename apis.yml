apis:
- aid: trigger-dev:trigger-dev-realtime
  name: Trigger.dev Realtime API
  description: >-
    The Trigger.dev Realtime API streams live run state and typed stream data to backend and frontend
    clients. Backend SDK methods include runs.subscribeToRun, runs.subscribeToRunsWithTag, and runs.subscribeToBatch.
    React hooks include useRealtimeRun, useRealtimeRunsWithTag, useRealtimeBatch, useRealtimeStream, useWaitToken,
    and trigger-plus-subscribe hooks. Powers progress UIs, AI streaming output, and human-in-the-loop
    interfaces.
  humanURL: https://trigger.dev/docs/realtime/overview
  tags:
  - Real-Time
  - Streaming
  - React
  - WebSockets
